name: InvoiceApp Build .NET 8

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore InvoiceApp.sln

      - name: Build
        run: dotnet build InvoiceApp.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test InvoiceApp.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish InvoiceApp.Web/InvoiceApp.Web.csproj --configuration Release --output ./publish

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  ftp-deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./publish

      - name: Prepare deployment files
        run: |
          echo "Configuring production settings..."
          sed -i 's/#{DB_SERVER}#/${{ secrets.DB_SERVER }}/g' ./publish/appsettings.Production.json
          sed -i 's/#{DB_USERNAME}#/${{ secrets.DB_USERNAME }}/g' ./publish/appsettings.Production.json
          sed -i 's/#{DB_PASSWORD}#/${{ secrets.DB_PASSWORD }}/g' ./publish/appsettings.Production.json

          echo "Creating log directory..."
          mkdir -p ./publish/logs

          echo "Deployment files prepared"

      - name: Put site in maintenance mode
        continue-on-error: true
        run: |
          # FTP_SERVER may carry a scheme or stray whitespace that the FTP-Deploy
          # action tolerates but curl rejects ("URL using bad/illegal format").
          FTP_HOST="$(printf '%s' "${{ secrets.FTP_SERVER }}" | tr -d '[:space:]' | sed -E 's#^ftps?://##')"

          cat << 'EOF' > app_offline.htm
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>Maintenance</title></head>
          <body style="font-family:Segoe UI,Arial,sans-serif;padding:40px;max-width:700px;margin:auto;">
            <h1>We will be back shortly</h1>
            <p>System update in progress. Please try again in a few minutes.</p>
          </body>
          </html>
          EOF

          curl --fail --ftp-create-dirs \
            -T ./app_offline.htm \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${FTP_HOST}/blacktech.gcweproperty.co.za/wwwroot/app_offline.htm"

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /blacktech.gcweproperty.co.za/wwwroot/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Remove maintenance mode file
        if: always()
        continue-on-error: true
        run: |
          FTP_HOST="$(printf '%s' "${{ secrets.FTP_SERVER }}" | tr -d '[:space:]' | sed -E 's#^ftps?://##')"
          curl --fail --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --quote "DELE /blacktech.gcweproperty.co.za/wwwroot/app_offline.htm" \
            "ftp://${FTP_HOST}/"

      - name: Verify application startup
        run: |
          # Smoke test: confirm the app actually starts after deploy. A startup
          # failure (e.g. a migration throwing -> HTTP 500.30) shows up as a 5xx
          # or an unreachable host. Any response < 500 means the app pipeline
          # booted. Retry to allow cold start + EF migrations to complete.
          URL="http://blacktech.gcweproperty.co.za/wwwroot/"
          ATTEMPTS=12
          DELAY=15
          CODE="000"
          echo "Health check: $URL"
          for i in $(seq 1 "$ATTEMPTS"); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)"
            echo "Attempt $i/$ATTEMPTS -> HTTP $CODE"
            if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then
              echo "Application is up (HTTP $CODE)."
              exit 0
            fi
            echo "Not ready yet (HTTP $CODE); waiting ${DELAY}s..."
            sleep "$DELAY"
          done
          echo "::error::Application did not start cleanly after deploy (last response: HTTP $CODE)."
          exit 1

      - name: Deployment Summary
        if: success()
        run: |
          echo "========================================="
          echo "INVOICEAPP DEPLOYMENT COMPLETED"
          echo "========================================="
          echo ""
          echo "Application URL: http://blacktech.gcweproperty.co.za/wwwroot/"
          echo "FTP Directory: /blacktech.gcweproperty.co.za/wwwroot/"
          echo ""
          echo "NOTE: EF Core migrations run automatically on app startup (Program.cs)."
